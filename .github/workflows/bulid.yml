name: Build IPA

# 手动触发（你也可以加 push/pull_request 触发）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Xcode and macOS info
        run: |
          xcodebuild -version
          sw_vers

      - name: Build archive
        run: |
          set -e
          mkdir -p build
          xcodebuild -project tkp.xcodeproj -scheme tkp -configuration Release -sdk iphoneos archive -archivePath build/tkp.xcarchive
        shell: bash

      - name: Export IPA
        run: |
          set -e
          mkdir -p build/output
          xcodebuild -exportArchive \
            -archivePath build/tkp.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ExportOptions.plist
        shell: bash

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tkp-ipa
          path: build/output/*.ipa
