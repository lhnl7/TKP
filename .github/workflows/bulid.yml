name: Build IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive (No Signing)
        run: |
          xcodebuild \
            -project tkp.xcodeproj \
            -scheme tkp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive \
            -archivePath build/tkp.xcarchive

      - name: Export IPA (No Signing)
        run: |
          xcodebuild -exportArchive \
            -archivePath build/tkp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist || true

      - name: Zip IPA
        run: |
          cd build/ipa
          zip -r tkp_unsigned.zip .

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: tkp-unsigned-ipa
          path: build/ipa
