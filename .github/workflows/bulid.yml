name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build .app (no signing)
        run: |
          xcodebuild \
            -project tkp.xcodeproj \
            -scheme tkp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            -derivedDataPath build

      - name: Create Payload folder
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/tkp.app Payload/

      - name: Create IPA
        run: |
          zip -r tkp_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tkp-unsigned-ipa
          path: tkp_unsigned.ipa
